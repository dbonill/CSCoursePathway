<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Computer Science Pathway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* VOICE: formal school program guide, read in seconds by families
   IDEA: a 16-bit style overworld map of the course sequence, toured by the school's Bronco
   PICTURE: raised plateaus with cliffs, bridges, ladders and a castle; the Bronco walks stop to stop
   COLOUR and TYPE: school navy and orange framing a green/blue pixel map; Source Serif 4 headings + Source Sans 3 body
   LAYOUT: map large on the left, course details on the right; stacked under 900px */
:root{color-scheme:dark;--bg:#041e42;--deep:#021431;--panel:#0b2a5a;--ink:#fff;--soft:#c9d6ee;--org:#f26722;--org2:#ff9a5c;--line:#24477f}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column}
h1,h2{font-family:"Source Serif 4",Georgia,serif;font-weight:700;text-wrap:balance}
header{display:flex;align-items:center;gap:18px;padding:12px max(3vw,16px);background:var(--deep);border-bottom:4px solid var(--org)}
header img{width:60px;height:auto;flex:none}
header h1{margin:0;font-size:clamp(20px,2.4vw,32px);line-height:1.15}
header p{margin:2px 0 0;color:var(--soft);font-size:16px}
.hint{margin-left:auto;color:var(--org2);font-weight:600;font-size:16px;text-align:right}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.mapwrap{display:grid;place-items:center;padding:14px}
.map{position:relative;container-type:inline-size;overflow:hidden;width:min(100%,calc((100vh - 130px)*1.6));aspect-ratio:16/10;box-shadow:0 0 0 4px var(--deep),0 0 0 8px var(--org)}
.map canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hit{position:absolute;transform:translate(-50%,-50%);width:6%;aspect-ratio:1;background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
.hit:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tagline{position:absolute;transform:translateX(-50%);white-space:nowrap;background:rgba(2,20,49,.9);color:#fff;font-weight:600;font-size:clamp(11px,1.1vw,16px);padding:2px 9px;border:2px solid var(--deep);pointer-events:none;line-height:1.3}
.tagline b{color:var(--org2);margin-right:6px}
.tagline.on{background:var(--org);border-color:#fff}.tagline.on b{color:#fff}
.lang{position:absolute;transform:translate(-50%,-50%);background:#8a5a2a;color:#fff3d6;border:2px solid #2a1608;box-shadow:0 3px 0 #2a1608;font:700 clamp(9px,.95vw,14px)/1.3 ui-monospace,Menlo,Consolas,monospace;padding:1px 6px;pointer-events:none;animation:lb 1.6s ease-in-out infinite alternate}
@keyframes lb{to{margin-top:-5px}}
@media(prefers-reduced-motion:reduce){.lang{animation:none}}
.snip{position:absolute;z-index:9;transform:translateX(-50%);background:#0b1a2e;color:#7ee05e;border:2px solid #7fb0ff;font:600 clamp(8px,1cqw,12px)/1.3 ui-monospace,Menlo,Consolas,monospace;padding:1px 6px;white-space:nowrap;pointer-events:none;animation:pop 2.1s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.snip.j{color:#ffcf9e;border-color:#f26722}
.algo{position:absolute;transform:translate(-50%,-50%);background:#8a5a2a;color:#fff3d6;border:2px solid #2a1608;box-shadow:0 3px 0 #2a1608;padding:2px 8px;text-align:center;font:700 clamp(9px,.95vw,14px)/1.25 "Source Sans 3",sans-serif;pointer-events:none;white-space:nowrap}
.algo small{display:block;font-weight:600;font-size:.82em;color:#f2d9a0}
.gl{position:absolute;transform:translate(-50%,-50%);font:700 clamp(8px,.85vw,13px)/1 "Source Sans 3",sans-serif;color:#1a1030;pointer-events:none}
.gw{position:absolute;transform:translate(-50%,-50%);background:#fff3d6;color:#1a1030;border:1px solid #1a1030;font:700 clamp(7px,.75vw,11px)/1.1 ui-monospace,Menlo,monospace;padding:0 2px;pointer-events:none}
.dcon{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;background:#0b1a2e;border:2px solid #f26722;padding:2px 8px;pointer-events:none;white-space:nowrap;font:600 clamp(8px,.85vw,12px)/1.35 ui-monospace,Menlo,Consolas,monospace}
.dcon span{color:#0b1a2e;background:#f26722;padding:0 4px;font-size:.8em}
.dcon code{color:#ffcf9e}
.dcon code.flash{animation:fl .5s ease-out}
@keyframes fl{from{color:#fff;transform:translateY(-3px)}to{transform:none}}
.ap{display:inline-block;margin-left:7px;background:#fff;color:#13285e;font-weight:700;font-size:.78em;padding:0 5px;border-radius:3px;vertical-align:1px}
.tagline.on .ap{color:#a8430f}
.snip.js{color:#fff08a;border-color:#9b59d0;animation-name:popR}
@keyframes popR{0%{opacity:0;transform:translate(-100%,10px) scale(.6)}15%{opacity:1;transform:translate(-100%,0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-100%,-14px)}}
.algo.stone{background:linear-gradient(#a7afbd,#8a93a3);color:#1a1030;border-color:#3a3f52;box-shadow:0 3px 0 #3a3f52;border-radius:6px 10px 5px 9px}
.algo.stone small{color:#2a2f42}
.won{position:absolute;transform:translate(-50%,-50%);background:#ffffff;color:#13285e;border:2px solid #13285e;font:700 clamp(9px,.95vw,14px)/1.3 "Source Sans 3",sans-serif;padding:1px 7px;border-radius:10px;pointer-events:none;white-space:nowrap;animation:wp .3s ease-out}
@keyframes wp{from{transform:translate(-50%,-30%) scale(.5)}}
.score{position:absolute;transform:translate(-50%,-50%);color:#13285e;text-align:center;pointer-events:none;font:700 clamp(12px,1.35vw,20px)/1 "Source Sans 3",sans-serif;white-space:nowrap}
.score b.o{color:#e2561a}.score b.bl{color:#1f6fd0}.score span{margin:0 6px;color:#13285e}
.score small{display:block;font-size:.55em;font-weight:700;color:#3a4a6a;margin-top:3px}
.score em{display:block;font-style:normal;font-size:.5em;letter-spacing:.02em;color:#3a4a6a;margin-bottom:3px}
.snip.act{background:none;border:0;padding:0;font:clamp(8px,1cqw,11px)/1.2 "Press Start 2P",ui-monospace,monospace;-webkit-font-smoothing:none;color:#fff;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,2px 2px #000,-2px -2px #000,2px -2px #000,-2px 2px #000;animation:actp 1s cubic-bezier(.2,.8,.3,1) forwards;will-change:transform,opacity}
.snip.ao,.snip.ab{color:#fff}
.snip.talk{animation:talk 1.6s ease-out forwards}
@keyframes talk{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,-4px)}100%{opacity:0;transform:translate(-50%,-8px)}}

@keyframes actp{0%{opacity:0;transform:translate(-50%,6px) scale(.4) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,0) scale(1.1) rotate(4deg)}70%{opacity:1;transform:translate(-50%,-8px) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-14px)}}
.tagline.cert,.tagline.on.cert{border:3px solid #2de0c8;box-shadow:0 0 0 1px #1a1030;animation:certGlow 2.2s ease-in-out infinite}
@keyframes certGlow{0%,100%{border-color:#2de0c8;box-shadow:0 0 0 1px #1a1030,0 0 0 0 rgba(45,224,200,0)}50%{border-color:#8ff7ea;box-shadow:0 0 0 1px #1a1030,0 0 10px 2px rgba(45,224,200,.75)}}
.box.out.cert{border-color:#2de0c8;border-left:6px solid #2de0c8;animation:certBox 2.2s ease-in-out infinite}.box.out.cert h3{color:#2de0c8}
@keyframes certBox{0%,100%{box-shadow:0 0 0 0 rgba(45,224,200,0)}50%{box-shadow:0 0 12px 1px rgba(45,224,200,.45)}}
@media(prefers-reduced-motion:reduce){.tagline.cert,.box.out.cert{animation:none}}
.legend-map i.cert{background:#0b1a2e;border:3px solid #2de0c8}
.tabtxt{position:absolute;transform:translate(-50%,-50%);color:#fff;font:700 clamp(7px,.8vw,12px)/1 "Source Sans 3",sans-serif;pointer-events:none;white-space:nowrap}
.steam{position:absolute;transform:translate(-50%,-50%);background:#fff;color:#13285e;font:700 clamp(7px,.75vw,11px)/1.2 ui-monospace,Menlo,Consolas,monospace;padding:3px 9px;border-radius:999px;box-shadow:0 0 0 2px #c9d6ee;pointer-events:none;white-space:nowrap;animation:stm 1.9s ease-out forwards}
.steam::before,.steam::after{content:"";position:absolute;background:#fff;border-radius:50%;z-index:-1;box-shadow:0 0 0 2px #c9d6ee}
.steam::before{width:14px;height:14px;left:8px;top:-6px}.steam::after{width:10px;height:10px;right:10px;top:-4px}
@keyframes stm{0%{opacity:0;transform:translate(-50%,6px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1)}70%{opacity:.9}100%{opacity:0;transform:translate(-30%,-34px) scale(1.15);filter:blur(1.5px)}}
.algo.ide{font-size:clamp(8px,.85vw,13px);padding:1px 6px}
.box.ide{border-left-color:#3b8fd9}.ides{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px}.ides span{background:#13285e;border:1px solid #3b5a9a;padding:2px 10px;border-radius:4px;font-weight:700}.box.ide small{color:var(--soft);font-size:15px}
.pennant{position:absolute;z-index:8;transform:translateY(-50%);background:#f26722;color:#fff;font:700 clamp(8px,.85vw,13px)/1 "Source Sans 3",sans-serif;padding:4px 18px 4px 7px;clip-path:polygon(0 0,100% 0,88% 50%,100% 100%,0 100%);pointer-events:none;white-space:nowrap;border-left:2px solid #2a1608}
.yr{display:inline-block;margin:0 0 16px;background:#13285e;border:1px solid #3b5a9a;border-radius:4px;padding:3px 10px;font-weight:700;font-size:15px}
#info.fade>*{animation:infoIn .5s ease-out both}#info.fade>*:nth-child(2){animation-delay:.05s}#info.fade>*:nth-child(3){animation-delay:.1s}#info.fade>*:nth-child(4){animation-delay:.15s}#info.fade>*:nth-child(5){animation-delay:.2s}#info.fade>*:nth-child(6){animation-delay:.25s}#info.fade>*:nth-child(7){animation-delay:.3s}
@keyframes infoIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#info.fade>*{animation:none}}
.sum{margin:0 0 14px;font-size:17px;line-height:1.5}
.ides em{font-style:normal;font-size:14px;color:var(--soft);width:72px;align-self:center}.ides span.pl{background:#5a2a10;border-color:#f26722}.ides span.pl.any{background:transparent;border:1px dashed #ff9a5c;color:#ffcf9e}.ides{align-items:center}
.fg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;z-index:7}
.flyer{position:absolute;left:0;top:0;display:flex;align-items:center;pointer-events:none;z-index:6;will-change:transform;visibility:hidden}
.flyer img{width:clamp(44px,5.2cqw,78px);image-rendering:pixelated;display:block}
.flyer .rope{width:clamp(12px,1.6cqw,24px);height:2px;background:#e8e2d2;opacity:.9}
.banner{position:relative;background:#ffffff;border:2px solid #002870;border-bottom:4px solid #80081a;padding:2px 14px 2px 10px;font:800 clamp(9px,1.25cqw,18px)/1.1 "Source Sans 3",system-ui,sans-serif;letter-spacing:.04em;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.25);clip-path:polygon(0 0,100% 6%,96% 50%,100% 94%,0 100%);animation:flap .6s ease-in-out infinite alternate}
.banner .n{color:#002870}.banner .t{color:#009090}
@keyframes flap{to{transform:skewY(-2deg) translateY(1px)}}
.legend-map{position:absolute;left:2%;top:3%;z-index:8;background:rgba(2,20,49,.65);border:2px solid var(--deep);padding:8px 12px;font-size:clamp(11px,1.05vw,15px);line-height:1.6;pointer-events:none}
.legend-map div{display:flex;align-items:center;gap:8px;white-space:nowrap}.legend-map i{width:14px;height:14px;flex:none;border:2px solid #021431}
aside{background:var(--panel);border-left:4px solid var(--org);padding:clamp(20px,2.4vw,36px);display:flex;flex-direction:column;gap:16px}
.kicker{color:var(--org2);font-weight:700;font-size:15px;margin:0}
aside h2{margin:0;font-size:clamp(24px,2.4vw,34px);line-height:1.1}
.meta{margin:-6px 0 0;color:var(--soft);font-size:17px}
.box{background:var(--deep);border:1px solid var(--line);border-left:4px solid var(--line);padding:14px 16px}
.box h3{margin:0 0 6px;font-size:15px;font-weight:700;color:var(--soft)}
.box ul{margin:0;padding-left:1.1em}.box li{margin:4px 0}
.out{border-left-color:var(--org)}
.out p{margin:0;font-weight:700;font-size:18px}
.out small{display:block;font-weight:400;color:var(--soft);font-size:15px;margin-top:2px}
.foot{margin-top:auto;display:grid;gap:12px}
.next{display:flex;justify-content:space-between;gap:12px;font-size:15px;color:var(--soft)}
.bar{height:6px;background:var(--deep);border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--org)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button.b{font:inherit;font-weight:700;font-size:16px;min-height:48px;padding:10px 18px;border:2px solid var(--org);background:var(--org);color:#fff;cursor:pointer;border-radius:4px}
button.b.ghost{background:transparent}
button.b:focus-visible{outline:3px solid #fff;outline-offset:3px}
.about{font-size:14px;color:var(--soft);margin:0;border-top:1px solid var(--line);padding-top:12px}
@media(max-width:900px){main{grid-template-columns:1fr}aside{border-left:0;border-top:4px solid var(--org)}.map{width:100%}.hint{display:none}}
</style>
</head>

  if(puff&&now-puff<450){const k=(now-puff)/450,R=6+k*14;for(let a=0;a<8;a++){const t=a*Math.PI/4;r('#ffffff',bx+Math.cos(t)*R-1,by-20+Math.sin(t)*R-1,2,2)}}
}

// ---------- Dijkstra on the CS III island ----------
const GN=[[260,14],[225,29],[295,29],[205,43],[243,43],[277,43],[313,43]],NM='ABCDEFG';
const GE=[[0,1,1],[0,2,1],[1,3,1],[1,4,1],[2,5,1],[2,6,1]];
const DSTEPS=(()=>{const n=GN.length,vis=Array(n).fill(false),par=Array(n).fill(-1),st=[];
  const snap=(o)=>st.push(Object.assign({vis:vis.slice(),par:par.slice()},o));
  const nb=u=>GE.map(([a,b])=>a===u?b:b===u?a:-1).filter(v=>v>=0).sort((p,q)=>p-q);
  const dfs=(u,from)=>{vis[u]=true;snap({k:'visit',v:u,e:from<0?null:[Math.min(from,u),Math.max(from,u)],code:from<0?`dfs(${NM[u]});  // start at ${NM[u]}`:`dfs(${NM[u]});  // visit ${NM[u]}`});
    nb(u).forEach(v=>{if(!vis[v]){par[v]=u;dfs(v,u)}});
    if(from>=0)snap({k:'back',v:from,code:`return;  // back to ${NM[from]}`})};
  dfs(0,-1);snap({k:'end',code:'// every node visited!'});return st})();
const DSTEP=1.3,DPER=DSTEPS.length*DSTEP+3;let lastStep=-1;
const lnp=(a,b,c,d,col)=>{let dx=Math.abs(c-a),dy=-Math.abs(d-b),sx=a<c?1:-1,sy=b<d?1:-1,e=dx+dy;for(;;){r(col,a,b,1,1);if(a===c&&b===d)break;const e2=2*e;if(e2>=dy){e+=dy;a+=sx}if(e2<=dx){e+=dx;b+=sy}}};
function DIJ(now){const t=now/1000;
  const i=reduce?DSTEPS.length-1:Math.min(DSTEPS.length-1,Math.floor((t%DPER)/DSTEP)),S=DSTEPS[i];window.__dfs=S;
  GE.forEach(([a,b])=>{const tree=(S.par[b]===a&&S.vis[b])||(S.par[a]===b&&S.vis[a]);const cur=S.e&&S.e[0]===a&&S.e[1]===b;
    const col=cur?'#ffd23f':tree?'#f26722':'#0b1a2e';const [x1,y1]=GN[a],[x2,y2]=GN[b];
    lnp(x1,y1,x2,y2,col);lnp(x1,y1+1,x2,y2+1,cur?'#c9a020':tree?'#a8430f':'#0b1a2e')});
  GN.forEach(([a,b],k)=>{const cur=S.v===k&&S.k!=='end';
    const fill=cur?'#ffd23f':S.vis[k]?'#f26722':'#13285e';
    const bob=reduce?0:Math.round(Math.sin(t*2.2+k*1.3));const wl=b+6+bob;
    if(cur&&!reduce){const p=(t*1.5)%1;ell(a,b+7,10+p*6|0,3+p*2|0,'#bfe0ff');ell(a,b+7,9+p*6|0,2+p*2|0,'#3a78e8')}
    ell(a,b+7,10,3,'#2a62c8');ell(a,b+7,9,2,'#5590f0');
    const hw=j=>j<4?5:j<8?4:3;
    for(let j=0;j<13;j++){const w=hw(j);r('#1a1030',a-w-1,wl-2-j,2*w+3,1)}r('#1a1030',a-4,wl-16,9,2);
    for(let j=0;j<13;j++){const w=hw(j);r(j>=7?fill:'#ffffff',a-w,wl-2-j,2*w+1,1)}
    r('#1a1030',a-4,wl-9,9,1);r('#ffffff66',a-3,wl-13,1,4);
    r('#1a1030',a-2,wl-20,5,5);r(cur&&!reduce&&(t*4|0)%2?'#fff6a0':cur?'#ffd23f':'#c9d2e0',a-1,wl-19,3,3);
    r('#1a1030',a-7,wl-2,15,4);r('#c9d2e0',a-6,wl-1,13,2);});
  if(i!==lastStep){lastStep=i;const cn=document.getElementById('dcode');if(!cn)return;cn.textContent=S.code;cn.classList.remove('flash');void cn.offsetWidth;cn.classList.add('flash')}
}

function jump(i){walk=null;at=(i+C.length)%C.length;pos=[C[at].x,C[at].y];puff=performance.now();window.__arr=puff;nextAt=puff+STAY;show(at)}
function startWalk(){
  if(reduce){jump(at+1);return}
  const L=LEGS[at];let len=0;for(let k=0;k<L.length-1;k++)len+=Math.abs(L[k+1][0]-L[k][0])+Math.abs(L[k+1][1]-L[k][1]);
  walk={L,len,d:0,to:(at+1)%C.length};
  document.querySelectorAll('.tagline').forEach(t=>t.classList.remove('on'));
  nextTxt.textContent='Walking to: '+C[walk.to].title;
}
function along(L,d){for(let k=0;k<L.length-1;k++){const [a,b]=L[k],[c,e]=L[k+1],s=Math.abs(c-a)+Math.abs(e-b);if(d<=s){const t=s?d/s:0;return[a+(c-a)*t,b+(e-b)*t]}d-=s}return L[L.length-1]}
function tick(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(walk){const px0=pos[0];walk.d+=SPEED*dt;pos=along(walk.L,walk.d);const ddx=pos[0]-px0;if(Math.abs(ddx)>.001)window.__face=ddx>0?1:-1;if(walk.d>=walk.len){at=walk.to;walk=null;pos=[C[at].x,C[at].y];nextAt=now+STAY;window.__arr=now;show(at)}}
  else if(now>=nextAt)startWalk();
  barFill.style.width=walk?'100%':Math.min(100,(1-(nextAt-now)/STAY)*100)+'%';
  render(now);requestAnimationFrame(tick);
}

document.getElementById('prev').onclick=()=>jump((walk?walk.to-1:at)-1);

{const PL=['.oo...................','.ooo..................','.oooo........cc.......','.owwwwwwwwwwwcbbw...k.','.wwwwwwwwwwwwwwwwwwwkk','..wwwonnnnnnnnowwww.k.','...wwwwwwwwwwwwwww....','........nnnnnn........'];
